name: Deploy API

# Only run this workflow when the API directory changes
on:
  push:
    paths:
      - 'api/**'
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    # The Mathy fork does not use the upstream feedback API. Keeping this job
    # upstream-only avoids failed deployments when its private secrets are absent.
    if: github.repository == 'fmhy/edit'
    name: Build and Deploy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm api:build
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          vars: WEBHOOK_URL
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
