name: Sync with upstream

on:
  schedule:
    # Check every six hours; GitHub may delay scheduled runs under load.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'fmhy/edit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream content
        env:
          UPSTREAM_REPOSITORY: fmhy/edit
        run: |
          bash .github/scripts/sync-upstream.sh

      # A failed build or fork-specific smoke check must prevent the push.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Uses the exact packageManager version (and integrity hash) in package.json.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and check fork
        run: |
          pnpm docs:build
          node scripts/check-sync-build.mjs

      - name: Push verified sync
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo "No new upstream content to push."
          else
            git push origin HEAD:main
          fi
