name: Sync with upstream

on:
  schedule:
    # Run every day at 03:17 UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'fmhy/edit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream content
        env:
          UPSTREAM_REPOSITORY: fmhy/edit
        run: |
          bash .github/scripts/sync-upstream.sh
          git push origin HEAD:main
